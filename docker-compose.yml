services:
  postgres_primary:
    image: postgres:15-alpine
    container_name: tce_postgres_primary
    environment:
      POSTGRES_USER: tce_user
      POSTGRES_PASSWORD: tce_secure_password
      POSTGRES_DB: tce_bonafide
    ports:
      - "5434:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
    restart: unless-stopped

  postgres_replica:
    image: postgres:15-alpine
    container_name: tce_postgres_replica
    environment:
      POSTGRES_USER: tce_user
      POSTGRES_PASSWORD: tce_secure_password
      POSTGRES_DB: tce_bonafide
    ports:
      - "5435:5432"
    depends_on:
      - postgres_primary
    command: >
      postgres
      -c hot_standby=on
      -c shared_buffers=128MB
      -c work_mem=8MB
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tce_redis
    command: redis-server --requirepass tce_redis_secure_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    container_name: student-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_PRIMARY_URL=postgres://tce_user:tce_secure_password@postgres_primary:5432/tce_bonafide
      - DATABASE_REPLICA_URL=postgres://tce_user:tce_secure_password@postgres_replica:5432/tce_bonafide
      - REDIS_URL=redis://:tce_redis_secure_password@redis:6379
    depends_on:
      - postgres_primary
      - redis
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: admin-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - DATABASE_PRIMARY_URL=postgres://tce_user:tce_secure_password@postgres_primary:5432/tce_bonafide
      - DATABASE_REPLICA_URL=postgres://tce_user:tce_secure_password@postgres_replica:5432/tce_bonafide
      - REDIS_URL=redis://:tce_redis_secure_password@redis:6379
    depends_on:
      - postgres_primary
      - redis
    restart: unless-stopped

  dev-service:
    build:
      context: .
      dockerfile: services/dev-service/Dockerfile
    container_name: dev-service
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - DATABASE_PRIMARY_URL=postgres://tce_user:tce_secure_password@postgres_primary:5432/tce_bonafide
      - DATABASE_REPLICA_URL=postgres://tce_user:tce_secure_password@postgres_replica:5432/tce_bonafide
      - REDIS_URL=redis://:tce_redis_secure_password@redis:6379
      - STUDENT_SERVICE_URL=http://student-service:3001
      - ADMIN_SERVICE_URL=http://admin-service:3002
    depends_on:
      - postgres_primary
      - redis
    restart: unless-stopped

volumes:
  postgres_primary_data:
  redis_data:
