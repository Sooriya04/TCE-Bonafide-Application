services:
  student_service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    network_mode: host
    environment:
      - PORT=3001
      - DATABASE_PRIMARY_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - DATABASE_REPLICA_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - DEV_SECRET=${DEV_SECRET}
      - DEV_PASSWORD_HASH=${DEV_PASSWORD_HASH}
      - AUTH_EMAIL=${AUTH_EMAIL}
      - AUTH_PASS=${AUTH_PASS}
      - NODE_ENV=production
    restart: unless-stopped

  admin_service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    network_mode: host
    environment:
      - PORT=3004
      - DATABASE_PRIMARY_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - DATABASE_REPLICA_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - DEV_SECRET=${DEV_SECRET}
      - DEV_PASSWORD_HASH=${DEV_PASSWORD_HASH}
      - AUTH_EMAIL=${AUTH_EMAIL}
      - AUTH_PASS=${AUTH_PASS}
      - BACKUP_DAILY_RETENTION_DAYS=${BACKUP_DAILY_RETENTION_DAYS}
      - BACKUP_WEEKLY_RETENTION_WEEKS=${BACKUP_WEEKLY_RETENTION_WEEKS}
      - NODE_ENV=production
    restart: unless-stopped

  dev_service:
    build:
      context: .
      dockerfile: services/dev-service/Dockerfile
    network_mode: host
    environment:
      - PORT=3003
      - DATABASE_PRIMARY_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - DATABASE_REPLICA_URL=postgres://tce_user:${POSTGRES_PASSWORD}@localhost:5434/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - DEV_SECRET=${DEV_SECRET}
      - DEV_PASSWORD_HASH=${DEV_PASSWORD_HASH}
      - STUDENT_SERVICE_URL=http://localhost:3001
      - ADMIN_SERVICE_URL=http://localhost:3004
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
